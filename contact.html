<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Genesis Portfolio</title>
  <meta name="description" content="Get in touch with Bakhtiyar Sattarov.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mulish:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page page--contact">

  <!-- ===== HEADER ===== -->
  <header class="header container">
    <a href="index.html" class="header__logo" aria-label="Genesis – home">
      <img src="images/icons/logo.svg" alt="Genesis" width="90" height="19">
    </a>
    <nav class="nav" aria-label="Main">
      <ul class="nav__list">
        <li><a href="project.html" class="nav__link">Projects</a></li>
        <li><a href="contact.html" class="nav__link nav__link--active" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <!-- ===== CONTACT ===== -->
    <section class="contact container">
      <div class="contact__content">
        <h1 class="title">Full set of great<br> features to make your<br> product fresh</h1>
        <p class="text contact__text">Our favorite brands are our friends! We help them to achieve their goals, they help us to stay sharp.</p>
      </div>

      <form class="form contact__form" action="#" method="post">
        <div class="form__field">
          <label for="name" class="visually-hidden">Name</label>
          <input class="form__input" type="text" id="name" name="name" placeholder="Name" autocomplete="name" required>
        </div>
        <div class="form__field">
          <label for="email" class="visually-hidden">Email</label>
          <input class="form__input" type="email" id="email" name="email" placeholder="Email" autocomplete="email" required>
        </div>
        <div class="form__field">
          <label for="message" class="visually-hidden">Message</label>
          <textarea class="form__input form__input--message" id="message" name="message" placeholder="Message" rows="1" required></textarea>
        </div>
        <button type="submit" class="button form__button">Submit</button>
      </form>
    </section>

    <!-- ===== MAP ===== -->
    <figure class="map container">
      <img src="images/map.jpg" alt="Map showing the studio location">
    </figure>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer container">
    <a href="index.html" class="header__logo" aria-label="Genesis – home">
      <img src="images/icons/logo.svg" alt="Genesis" width="90" height="19">
    </a>
    <div class="footer__right">
      <nav class="nav" aria-label="Footer">
        <ul class="nav__list">
          <li><a href="project.html" class="nav__link">Projects</a></li>
          <li><a href="contact.html" class="nav__link">Contact</a></li>
        </ul>
      </nav>
      <ul class="social">
        <li><a href="https://dribbble.com" class="social__link" aria-label="Dribbble"><img src="images/icons/dribbble.svg" alt="" width="15" height="15"></a></li>
        <li><a href="https://instagram.com" class="social__link" aria-label="Instagram"><img src="images/icons/instagram.svg" alt="" width="15" height="15"></a></li>
        <li><a href="https://twitter.com" class="social__link" aria-label="Twitter"><img src="images/icons/twitter.svg" alt="" width="18" height="14"></a></li>
      </ul>
    </div>
  </footer>

</body>
</html>
